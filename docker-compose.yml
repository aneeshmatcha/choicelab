services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: choicelab
      POSTGRES_USER: choicelab
      POSTGRES_PASSWORD: choicelab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://choicelab:choicelab@db:5432/choicelab
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

